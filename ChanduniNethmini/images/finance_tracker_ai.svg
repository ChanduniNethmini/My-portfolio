<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2a1a"/>
      <stop offset="50%" style="stop-color:#0d3b2a"/>
      <stop offset="100%" style="stop-color:#071f14"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#22c55e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="200" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="0" y1="50" x2="640" y2="50" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="100" x2="640" y2="100" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="0" y1="150" x2="640" y2="150" stroke="#22c55e" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Bar chart (right side) -->
  <rect x="390" y="120" width="22" height="55" rx="4" fill="url(#bar1)" opacity="0.7"/>
  <rect x="422" y="90" width="22" height="85" rx="4" fill="url(#bar1)" opacity="0.8"/>
  <rect x="454" y="105" width="22" height="70" rx="4" fill="url(#bar2)" opacity="0.7"/>
  <rect x="486" y="70" width="22" height="105" rx="4" fill="url(#bar1)" opacity="0.9"/>
  <rect x="518" y="85" width="22" height="90" rx="4" fill="url(#bar2)" opacity="0.8"/>
  <rect x="550" y="55" width="22" height="120" rx="4" fill="url(#bar1)" filter="url(#glow)"/>

  <!-- Trend line -->
  <polyline points="390,118 422,88 454,103 486,68 518,82 561,52"
    fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Dots on line -->
  <circle cx="486" cy="68" r="4" fill="#4ade80" filter="url(#glow)"/>
  <circle cx="561" cy="52" r="5" fill="#22c55e" filter="url(#glow)"/>

  <!-- Chat bubble (left) -->
  <rect x="40" y="38" width="260" height="52" rx="12" fill="#0f2d1e" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
  <polygon points="64,90 80,90 72,104" fill="#0f2d1e"/>
  <text x="58" y="60" font-family="monospace" font-size="11" fill="#4ade80" opacity="0.9">AI Agent &gt; Analyzing your spending...</text>
  <text x="58" y="78" font-family="monospace" font-size="11" fill="#22c55e" opacity="0.7">Tool: query_database() ✓</text>

  <!-- Second chat bubble -->
  <rect x="40" y="112" width="240" height="44" rx="12" fill="#0a2218" stroke="#22c55e" stroke-opacity="0.2" stroke-width="1"/>
  <text x="58" y="130" font-family="monospace" font-size="10.5" fill="#86efac" opacity="0.8">💰 You spent $340 on dining</text>
  <text x="58" y="148" font-family="monospace" font-size="10.5" fill="#86efac" opacity="0.7">    this month. Save $120? 📊</text>

  <!-- Label -->
  <text x="40" y="185" font-family="sans-serif" font-size="11" fill="#22c55e" opacity="0.5" letter-spacing="2">PERSONAL FINANCE · AI AGENT · GPT-4o</text>
</svg>
