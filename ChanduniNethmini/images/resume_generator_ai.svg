<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#130826"/>
      <stop offset="55%" style="stop-color:#1e0d3b"/>
      <stop offset="100%" style="stop-color:#0d0620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="200" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <line x1="0" y1="66" x2="640" y2="66" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="0" y1="132" x2="640" y2="132" stroke="#a855f7" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Resume document (right) -->
  <rect x="400" y="20" width="170" height="165" rx="8" fill="#1a0d30" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Header bar -->
  <rect x="400" y="20" width="170" height="32" rx="8" fill="#2d1257" opacity="0.8"/>
  <rect x="400" y="40" width="170" height="12" fill="#2d1257" opacity="0.8"/>
  <text x="416" y="41" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c084fc">Jane Doe</text>
  <text x="416" y="52" font-family="sans-serif" font-size="8" fill="#a855f7" opacity="0.8">Full Stack Engineer · AI Specialist</text>
  <!-- ATS badge -->
  <rect x="510" y="24" width="50" height="16" rx="8" fill="#7c3aed" opacity="0.7"/>
  <text x="516" y="35" font-family="sans-serif" font-size="8" fill="#e9d5ff">ATS ✓</text>
  <!-- Content lines -->
  <rect x="414" y="62" width="60" height="5" rx="2" fill="#7c3aed" opacity="0.6"/>
  <rect x="414" y="72" width="140" height="3" rx="2" fill="#6d28d9" opacity="0.35"/>
  <rect x="414" y="79" width="120" height="3" rx="2" fill="#6d28d9" opacity="0.35"/>
  <rect x="414" y="86" width="130" height="3" rx="2" fill="#6d28d9" opacity="0.35"/>
  <rect x="414" y="98" width="55" height="5" rx="2" fill="#7c3aed" opacity="0.6"/>
  <rect x="414" y="108" width="140" height="3" rx="2" fill="#6d28d9" opacity="0.3"/>
  <rect x="414" y="115" width="100" height="3" rx="2" fill="#6d28d9" opacity="0.3"/>
  <rect x="414" y="127" width="55" height="5" rx="2" fill="#7c3aed" opacity="0.6"/>
  <rect x="414" y="137" width="140" height="3" rx="2" fill="#6d28d9" opacity="0.3"/>
  <rect x="414" y="144" width="115" height="3" rx="2" fill="#6d28d9" opacity="0.3"/>
  <rect x="414" y="151" width="128" height="3" rx="2" fill="#6d28d9" opacity="0.3"/>
  <rect x="414" y="163" width="80" height="3" rx="2" fill="#6d28d9" opacity="0.25"/>

  <!-- Arrow (transform indicator) -->
  <text x="370" y="107" font-family="sans-serif" font-size="22" fill="#a855f7" opacity="0.5" filter="url(#glow)">→</text>

  <!-- Input side (left) -->
  <rect x="42" y="30" width="290" height="38" rx="10" fill="#1a0d30" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1"/>
  <text x="58" y="47" font-family="monospace" font-size="10.5" fill="#c084fc" opacity="0.9">Raw Input &gt; 3 yrs exp, built APIs...</text>
  <text x="58" y="61" font-family="monospace" font-size="10.5" fill="#7c3aed" opacity="0.7">Injecting ATS keywords... ✦</text>

  <rect x="42" y="80" width="290" height="28" rx="10" fill="#1a0d30" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1"/>
  <text x="58" y="93" font-family="monospace" font-size="10.5" fill="#a78bfa" opacity="0.8">✓ Resume optimized</text>
  <text x="58" y="103" font-family="monospace" font-size="10" fill="#7c3aed" opacity="0.7">✓ Cover letter generated</text>

  <rect x="42" y="120" width="290" height="26" rx="10" fill="#1a0d30" stroke="#a855f7" stroke-opacity="0.12" stroke-width="1"/>
  <text x="58" y="133" font-family="monospace" font-size="10.5" fill="#c084fc" opacity="0.7">⬇ Downloading resume.pdf...</text>
  <text x="58" y="142" font-family="monospace" font-size="9.5" fill="#7c3aed" opacity="0.5">cover_letter.pdf</text>

  <!-- Label -->
  <text x="42" y="186" font-family="sans-serif" font-size="11" fill="#a855f7" opacity="0.45" letter-spacing="2">AI RESUME GENERATOR · ATS · OPENAI API</text>
</svg>
